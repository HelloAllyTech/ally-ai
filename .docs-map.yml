# Which documentation covers which code.
#
# Read by the shared docs-guard workflow (helloallytech/.github) on every PR, and by
# the weekly wiki reconciler. Adding a rule here is how you make a doc impossible to
# forget. Spec: https://tech.helloally.ai/#/wiki/contributing/docs-system.md
#
# requires:
#   <path>              a file in this repo — the PR must touch it
#   wiki:<page>         a page in the wiki repo — the PR body must carry a Wiki-PR: trailer
#
# Escape hatch: add the `docs:skip` label, or a `Wiki-PR: none — <reason>` trailer.

version: 1
repo: ally-ai

rules:
  - id: vector-collections
    watch:
      - "app/core/vector_db/constants.py"
      - "app/migrations/**"
    requires: wiki:repos/ally-ai.md
    why: >
      Weaviate collections are cross-repo state — ally-be's DATA_SCHEMA.md points at this
      file as the source of truth for the vector side of the platform.

  - id: repo-page-architecture
    watch:
      - "app/main.py"
      - "app/api/v1/endpoints/**"
    requires: wiki:repos/ally-ai.md
    why: The HTTP surface is what ally-be integrates against; the repo page documents it.

  - id: filler-eval-schema
    watch:
      - "app/core/filler_quality/**"
    requires: docs/filler-eval-judge-schema.md
    why: >
      The finding typology is a contract with ally-be, which persists these rows and
      computes the rates from them. A category added or renamed without the doc moving
      leaves the consumer guessing at what it means.

  - id: agent-entrypoints-in-sync
    watch:
      - "AGENTS.md"
      - "CLAUDE.md"
    requires: mirror
    why: >
      AGENTS.md and CLAUDE.md must stay byte-identical. `mirror` asserts equality rather
      than requiring a companion edit.
